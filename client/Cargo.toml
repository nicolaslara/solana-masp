[package]
name = "masp-client"
version = "0.1.0"
edition = "2021"
description = "MASP client library - note primitives, key derivation, and transaction building"

[dependencies]
# Arkworks for BN254 field and curve operations
ark-bn254 = "0.5.0"
ark-grumpkin = "0.5.0"                                       # Grumpkin (embedded curve for BN254, matches Noir's std::embedded_curve_ops)
ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-serialize = { version = "0.5.0", features = ["derive"] }
## NOTE: avoid listing transitive deps here unless we directly use them.

# Poseidon hash (BN254 native, matches Noir)
light-poseidon = "0.4.0"

# Poseidon2 permutation (BN254). We use this to match Noir stdlib `std::hash::poseidon2::Poseidon2`
# by implementing the exact same sponge/IV logic in Rust and using Poseidon2(t=4) permutation.
taceo-poseidon2 = { version = "0.2.0", default-features = false, features = [
    "bn254",
    "t4",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
num-bigint = "0.4"

# Error handling
thiserror = "2.0.17"

# Random number generation (must match arkworks version)
rand = "0.8"
rand_core = "0.6"

# Async traits
async-trait = "0.1"

# Encryption (AEAD)
chacha20poly1305 = "0.10"

# Keccak256 for on-chain mock proofs (matches Solana's keccak syscall)
# Only needed when onchain-mock feature is enabled
sha3 = { version = "0.10", optional = true }

[dependencies.ultraplonk-core]
path = "../../solana-ultraplonk-verifier/crates/ultraplonk-core"
optional = true

# Solana SDK for building transactions (optional - only for real chain backend)
[dependencies.solana-sdk]
version = "3.0"
optional = true

[dependencies.solana-client]
version = "3.1"
optional = true

[features]
default = []

# Local UltraPlonk verification via ultraplonk-core (uses solana-bn254 in native mode).
# Use this for: local proof verification in tests.
ultraplonk-verifier = ["dep:ultraplonk-core"]

# On-chain mock prover/verifier for testing with Solana program.
# ⚠️ FOR LOCAL TESTING ONLY - generates keccak256-based mock proofs.
# Use this when testing against a Solana program compiled with mock-proofs feature.
onchain-mock = ["dep:sha3"]

# Real Solana chain backend (submits actual transactions)
solana-backend = ["dep:solana-sdk", "dep:solana-client"]

[dev-dependencies]
ark-grumpkin = "0.5.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
solana-sdk = "3.0"
solana-client = "3.1"
solana-keypair = "3.0"
sha3 = "0.10"
serde_json = "1.0"
rand = "0.8"
