[package]
name = "solana-masp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Multi-Asset Shielded Pool for Solana"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Solana program SDK
solana-program = "3.0"
# Pin base64ct to avoid edition2024 requirement (1.8+ needs Rust 1.85)
base64ct = "=1.6.0"

# Serialization
borsh = "1.5"

# Error handling
thiserror = "2"

# UltraPlonk verification (from sibling workspace)
# Note: For now we use a path dependency. In production, this would be a crate.
# Enable "std" for native builds (testing). BPF builds will use syscalls.
ultraplonk-core = { path = "../../../solana-ultraplonk-verifier/crates/ultraplonk-core" }

[features]
default = ["ultraplonk"]
no-entrypoint = []

# Proof system selection (only one should be enabled at a time)
ultraplonk = []
groth16 = []

# Enable real VKs (requires build.rs to generate them)
ultraplonk-real-vks = ["ultraplonk"]
groth16-real-vks = ["groth16"]

# LOCAL TESTING ONLY - enables update_root instruction and mock proofs
# DO NOT enable this in production deployments!
# In production, root updates come from Light Protocol or external indexer.
local-testing = []

# Use mock proof verification (keccak256-based, for testing with MockSpendProver)
# ⚠️ MUST be combined with local-testing - never use in production!
mock-proofs = ["local-testing"]

## NOTE:
## Profile settings must live at the workspace root `Cargo.toml`.
